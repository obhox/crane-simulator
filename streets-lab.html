<!doctype html>
<html>
<head><meta charset="utf-8"><title>streets lab (temporary)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { loadAssets, hdri, hdriEnvMap, hdriInfo, pbrMaterial } from './src/world/assets.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1.5);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.6;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
await loadAssets(() => {}, { renderer, quality: 'high' });
const scene = new THREE.Scene();
const k = 0.35;
scene.background = hdri('hdri_day_cloudy'); scene.backgroundIntensity = k;
scene.environment = hdriEnvMap('hdri_day_cloudy', renderer, { removeSun: true }); scene.environmentIntensity = k;
const info = hdriInfo('hdri_day_cloudy');
const sun = new THREE.DirectionalLight(info.sunColor, info.sunIntensity * k);
sun.position.copy(info.sunDir).multiplyScalar(80);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 200 });
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
const road = new THREE.Mesh(new THREE.PlaneGeometry(200, 10).rotateX(-Math.PI / 2), pbrMaterial('asphalt', { worldSize: [200, 10], albedo: 0.1 }));
road.receiveShadow = true; scene.add(road);
for (const s of [1, -1]) {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(200, 0.15, 3.5), pbrMaterial('sidewalk_pavers', { worldSize: [200, 3.5] }));
  sw.position.set(0, 0.075, s * 6.75); sw.receiveShadow = true; scene.add(sw);
  const g = new THREE.Mesh(new THREE.PlaneGeometry(200, 60).rotateX(-Math.PI / 2), pbrMaterial('grass', { worldSize: [200, 60], albedo: 0.13 }));
  g.position.set(0, 0.01, s * 38.5); g.receiveShadow = true; scene.add(g);
}
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 2, -12); camera.lookAt(0, 1, 0);
const lab = { THREE, scene, renderer, camera, sun, fns: [], t: 0 };
lab.view = (p, t, fov = 50) => { camera.position.set(...p); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(...t); sessionStorage.setItem('labView', JSON.stringify([p, t, fov])); };
try { const v = JSON.parse(sessionStorage.getItem('labView')); if (v) lab.view(...v); } catch {}
renderer.toneMappingExposure = 1.0;
lab.night = (n) => { const d = 1 - n; scene.backgroundIntensity = k * (0.02 + 0.98 * d); scene.environmentIntensity = k * (0.03 + 0.97 * d); sun.intensity = info.sunIntensity * k * d; };
window.lab = lab;
const cols = [0xb01d1d, 0x9ea3a8, 0x1a2740, 0xe9ebec, 0x1d5fa8, 0x2b2e33];
lab.showVehicles = async (spin = 0) => {
  const V = await import('./src/world/streets/vehicles.js');
  const old = scene.getObjectByName('showroom'); if (old) scene.remove(old);
  const g = new THREE.Group(); g.name = 'showroom'; scene.add(g);
  const cap = {}; for (const t of V.TYPE_NAMES) cap[t] = 3;
  const vr = new V.VehicleRenderer(g, cap);
  lab.fns = lab.fns.filter((f) => !f.veh);
  const f = (dt, t) => {
    vr.begin(); let x = -30;
    V.TYPE_NAMES.forEach((ty, i) => {
      const L = V.VEHICLE_TYPES[ty].L; x += L / 2 + 1.5;
      vr.push(ty, x, -1.75, spin * t, new THREE.Color(cols[i]), 0.5, t * 3 * (lab.roll ?? 1), lab.brake || 0, 1, lab.lod ? 200 : 10);
      vr.push(ty, x, 1.75, Math.PI, new THREE.Color(cols[(i + 2) % 6]), 0.5, 0, 0, 1, 200);
      x += L / 2 + 1.5;
    });
    vr.end(); vr.setNight(lab.nightV || 0);
  };
  f.veh = true; lab.fns.push(f); lab.vr = vr; return vr;
};
lab.city = async () => {
  const L = await import('./src/world/layout.js');
  for (const o of [...scene.children]) if (o.isMesh && o !== sun) scene.remove(o);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200).rotateX(-Math.PI / 2), pbrMaterial('grass', { worldSize: 1200, albedo: 0.12 }));
  grass.position.y = -0.02; grass.receiveShadow = true; scene.add(grass);
  const asph = pbrMaterial('asphalt', { worldSize: [4.04, 4.04], albedo: 0.1 });
  const sw = pbrMaterial('sidewalk_pavers', { worldSize: [1.8, 1.8], albedo: 0.2 });
  const world = (g, sx, sz) => { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx / 4.04, uv.getY(i) * sz / 4.04); return g; };
  for (const r of L.roadRects()) {
    const w = r.maxX - r.minX, d = r.maxZ - r.minZ;
    const m = new THREE.Mesh(world(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), w, d), asph);
    m.position.set((r.minX + r.maxX) / 2, 0, (r.minZ + r.maxZ) / 2); m.receiveShadow = true; scene.add(m);
    for (const s of [1, -1]) {
      const [bw, bd] = r.axis === 'x' ? [w, 3.5] : [3.5, d];
      const g = new THREE.BoxGeometry(bw, 0.15, bd); const uv = g.attributes.uv;
      for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * bw / 1.8, uv.getY(i) * bd / 1.8);
      const b = new THREE.Mesh(g, sw);
      b.position.set(r.axis === 'x' ? (r.minX + r.maxX) / 2 : r.c + s * 6.75, 0.075, r.axis === 'x' ? r.c + s * 6.75 : (r.minZ + r.maxZ) / 2);
      b.receiveShadow = true; scene.add(b);
    }
  }
  const S = await import('./src/world/streets/index.js');
  const t0 = performance.now();
  lab.streets = S.buildStreetLife(scene, { name: 'high', city: 1 });
  lab.buildMs = performance.now() - t0;
  scene.fog = new THREE.Fog(0xaebdcc, 350, 3200);
  lab.fns.push((dt) => lab.streets.update(dt, lab.nightV || 0));
  Object.assign(sun.shadow.camera, { left: -92, right: 92, top: 92, bottom: -92, near: 10, far: 480 });
  sun.target.position.set(6, 0, 6); sun.position.copy(info.sunDir).multiplyScalar(260).add(sun.target.position);
  sun.shadow.camera.updateProjectionMatrix();
};
const setups = { vehicles: () => lab.showVehicles(), city: () => lab.city() };
for (const k of location.hash.slice(1).split(',')) if (setups[k]) await setups[k]();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; lab.t += dt;
  for (const f of lab.fns) f(dt, lab.t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script>
</body>
</html>
