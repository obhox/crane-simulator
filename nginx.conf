server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Vite's hashed bundles never change.
    location /assets/index- {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Models, textures, HDRIs, audio.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
